[workspace]
name = "opennav_coverage"
channels = [
    "conda-forge",
    "main",
    "https://prefix.dev/robostack-jazzy",
    "https://buildfarm.tail25f52d.ts.net/get/aro"
]
channel-priority = "flexible"
platforms = ["linux-64"]
preview = ["pixi-build"]

[workspace.dependencies]
libortools = { version = "9.15.*", channel = "main" }
fields2cover = "==2.0.1"
libboost-devel = "1.90.*"

[dependencies]
ros2-distro-mutex = "0.20.*"
ros-jazzy-opennav-coverage = { path = "opennav_coverage" }
ros-jazzy-opennav-coverage-msgs = { path = "opennav_coverage_msgs" }
ros-jazzy-opennav-coverage-bt = { path = "opennav_coverage_bt" }
ros-jazzy-opennav-coverage-navigator = { path = "opennav_coverage_navigator" }
